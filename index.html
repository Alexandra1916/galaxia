<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Frases de Alexandra Lima para M</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      touch-action: none;
    }

    /* Botón de música */
    #music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
    }

    #music-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <canvas id="galaxy-canvas"></canvas>

  <!-- 🎵 Reproductor de música invisible -->
  <audio id="bg-music" loop>
    <!-- 🔁 Cambia esta ruta por tu archivo o URL -->
    <source src="musica.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <!-- 🎶 Botón para controlar la música -->
  <button id="music-btn" title="Activar música">🎵</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('galaxy-canvas'),
      antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = false;
    controls.minDistance = 10;
    controls.maxDistance = 200;
    controls.zoomSpeed = 0.8;

    const panLimit = 40;
    controls.target.set(0, 0, 0);

    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    const phrases = [
      "Desde que llegaste, mi vida brilla más ✨",
      "Eres mi casualidad más bonita 💖",
      "De Alecita para M❤️",
      "A tu lado encontré mi lugar en el mundo 🌍",
      "Me haces creer en la magia del amor ✨",
      "Eres mi presente y mi futuro 🌠",
      "Mi felicidad empieza con un mensaje tuyo 💌",
      "Cada latido me recuerda lo mucho que te amo 💓"
    ];

    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const fontSize = 48;
      canvas.width = 1024;
      canvas.height = 128;
      context.font = `bold ${fontSize}px Arial`;
      context.fillStyle = 'rgba(255, 255, 255, 0.8)';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(text, canvas.width / 2, canvas.height / 2);
      return new THREE.CanvasTexture(canvas);
    }

    const phraseCount = 200;
    const arms = 5;
    const radius = 80;
    const maxPhraseHeight = 20;
    const maxStarHeight = 40;

    for (let i = 0; i < phraseCount; i++) {
      const phraseIndex = i % phrases.length;
      const textTexture = createTextTexture(phrases[phraseIndex]);
      const material = new THREE.SpriteMaterial({
        map: textTexture,
        transparent: true,
        opacity: 0.8,
        depthWrite: false
      });

      const sprite = new THREE.Sprite(material);
      sprite.isPhrase = true;

      const angle = (i % (phraseCount / arms)) * (Math.PI * 2 / (phraseCount / arms));
      const armAngle = Math.floor(i / (phraseCount / arms)) * (Math.PI * 2 / arms);
      const distance = Math.pow(i / phraseCount, 0.7) * radius;
      const thicknessFactor = Math.pow(1 - (distance / radius), 2);
      const x = Math.cos(angle + armAngle) * distance;
      const z = Math.sin(angle + armAngle) * distance;
      const y = (Math.random() - 0.5) * maxPhraseHeight * thicknessFactor;
      sprite.position.set(x, y, z);
      sprite.scale.set(20, 2.5, 1);
      galaxyGroup.add(sprite);
    }

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 10000;
    const positions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * radius * 1.2;
      const thicknessFactor = Math.pow(1 - (Math.min(distance, radius) / radius), 1.5);
      const y = (Math.random() - 0.5) * maxStarHeight * thicknessFactor;

      positions[i * 3] = Math.cos(angle) * distance;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(angle) * distance;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.3,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });

    const stars = new THREE.Points(starGeometry, starMaterial);
    galaxyGroup.add(stars);

    const bgStarCount = 5000;
    const bgStarGeometry = new THREE.BufferGeometry();
    const bgPositions = new Float32Array(bgStarCount * 3);
    const bgColors = new Float32Array(bgStarCount * 3);
    const twinkleData = [];

    for (let i = 0; i < bgStarCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      const r = 400 + Math.random() * 100;

      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi);

      bgPositions.set([x, y, z], i * 3);
      const color = new THREE.Color(0xffffff);
      bgColors.set([color.r, color.g, color.b], i * 3);
      twinkleData.push({ speed: Math.random() * 0.5 + 0.1, offset: Math.random() * 10 });
    }

    bgStarGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
    bgStarGeometry.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));

    const bgStarMaterial = new THREE.PointsMaterial({
      size: 0.8,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });

    const backgroundStars = new THREE.Points(bgStarGeometry, bgStarMaterial);
    scene.add(backgroundStars);

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      const isMobile = width < 768 || width < height;
      if (isMobile) {
        camera.fov = 90;
        camera.position.set(0, 30, 100);
        controls.zoomSpeed = 1.2;
      } else {
        camera.fov = 75;
        camera.position.set(0, 25, 65);
        controls.zoomSpeed = 0.8;
      }
      galaxyGroup.children.forEach(child => {
        if (child.isPhrase) {
          if (isMobile) child.scale.set(14, 1.75, 1);
          else child.scale.set(20, 2.5, 1);
        }
      });
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', onWindowResize);
    onWindowResize();

    const clock = new THREE.Clock();
    function animate() {
      const elapsedTime = clock.getElapsedTime();
      galaxyGroup.rotation.y = elapsedTime * 0.05;

      const targetVector = new THREE.Vector2(controls.target.x, controls.target.z);
      if (targetVector.length() > panLimit) {
        targetVector.setLength(panLimit);
        controls.target.x = targetVector.x;
        controls.target.z = targetVector.y;
      }

      const colors = backgroundStars.geometry.attributes.color;
      for (let i = 0; i < bgStarCount; i++) {
        const data = twinkleData[i];
        const brightness = (Math.sin(elapsedTime * data.speed + data.offset) + 1) / 2 * 0.7 + 0.3;
        colors.setXYZ(i, brightness, brightness, brightness);
      }
      colors.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // 🎶 Control de música
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        music.pause();
        musicBtn.textContent = '🎵';
        isPlaying = false;
      } else {
        music.volume = 0.5;
        music.play().catch(err => console.log('Error al reproducir música:', err));
        musicBtn.textContent = '⏸️';
        isPlaying = true;
      }
    });
  </script>
</body>
</html>
